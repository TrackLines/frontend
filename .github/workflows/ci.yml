name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # known vulnerabilities in the shipped (production) dependencies (PCI DSS 6.3.1); dev-only tooling is out of scope
      - run: bun audit --prod
      # every visible string is in the catalogues (TL-550): wrapped strings that weren't extracted fail here
      - run: bun run i18n && git diff --exit-code -I 'POT-Creation-Date' -- locales
      - run: bun run test
      - run: bun run build
